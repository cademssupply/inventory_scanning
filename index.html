<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cameron Ambulance Employee Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #181818;
      color: white;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: #242424;
      border-bottom: 4px solid #f58220;
      text-align: center;
      padding: 25px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      color: #aaaaaa;
      font-size: 14px;
    }

    /* MAIN DASHBOARD */
    .dashboard {
      max-width: 800px;
      margin: auto;
      padding: 30px 18px;
    }

    /* REMOVE INVENTORY */
    .remove-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 150px;

      background: #f58220;
      color: #111;

      text-decoration: none;
      text-align: center;

      font-size: 34px;
      font-weight: 800;

      border-radius: 16px;

      box-shadow: 0 6px 18px rgba(0,0,0,.4);

      transition: 0.2s;
    }

    .remove-button:hover {
      background: #ff963d;
      transform: translateY(-2px);
    }

    .remove-button:active {
      transform: scale(.98);
    }

    /* ADD / COUNT INVENTORY */
    .inventory-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 100px;

      margin-top: 18px;

      background: #333333;
      color: white;

      border: 2px solid #f58220;

      text-decoration: none;
      text-align: center;

      font-size: 24px;
      font-weight: bold;

      border-radius: 14px;

      transition: 0.2s;
    }

    .inventory-button:hover {
      background: #414141;
    }

    /* EMPLOYEE RESOURCES */
    .section-title {
      margin-top: 35px;
      margin-bottom: 12px;

      color: #999999;

      font-size: 13px;
      font-weight: bold;

      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .resource-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 120px;
      padding: 18px;

      background: #292929;

      border: 1px solid #444444;
      border-radius: 14px;

      color: white;
      text-decoration: none;
      text-align: center;

      font-size: 21px;
      font-weight: bold;

      transition: 0.2s;
    }

    .resource-button:hover {
      background: #383838;
      border-color: #f58220;
      transform: translateY(-2px);
    }

    .resource-button span {
      display: block;
      margin-top: 7px;

      color: #999999;

      font-size: 12px;
      font-weight: normal;
    }

    /* FOOTER */
    .footer {
      margin-top: 40px;

      text-align: center;

      color: #666666;
      font-size: 12px;
    }

    /* PHONE / SMALL SCREEN */
    @media (max-width: 600px) {

      .header h1 {
        font-size: 24px;
      }

      .dashboard {
        padding: 20px 12px;
      }

      .remove-button {
        min-height: 135px;
        font-size: 29px;
      }

      .inventory-button {
        min-height: 90px;
        font-size: 21px;
      }

      .resource-grid {
        grid-template-columns: 1fr;
      }

      .resource-button {
        min-height: 90px;
      }
    }

  </style>
</head>


<body>

  <!-- HEADER -->
  <div class="header">

    <h1>Cameron Ambulance</h1>

    <p>Employee Dashboard</p>

  </div>


  <!-- DASHBOARD -->
  <main class="dashboard">


    <!-- PRIMARY ACTION -->

    <a class="remove-button" href="remove.html">

      REMOVE INVENTORY

    </a>


    <!-- INVENTORY MANAGEMENT -->

    <a class="inventory-button" href="inventory.html">

      ADD / COUNT INVENTORY

    </a>


    <!-- EMPLOYEE RESOURCES -->

    <div class="section-title">

      Employee Resources

    </div>


    <div class="resource-grid">


      <!-- PS TRAX -->

      <a
        class="resource-button"
        href="https://app1.pstrax.com/"
        target="_blank"
        rel="noopener noreferrer"
      >

        Truck Checks

        <span>PS Trax</span>

      </a>


      <!-- EMPLOYEE CERTIFICATES -->

      <a
        class="resource-button"
        href="https://forms.gle/3Ngj756zt158egfg9"
        target="_blank"
        rel="noopener noreferrer"
      >

        Employee Certificates

        <span>Licenses & Certifications</span>

      </a>


    </div>


    <!-- FOOTER -->

    <div class="footer">

      Cameron Ambulance District

    </div>


  </main>

</body>
</html>
