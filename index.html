<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Inventory Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}.wrap{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.1)}h1{text-align:center;font-size:24px}.status{margin-top:12px;padding:12px;border-radius:10px;background:#f9fafb;text-align:center;font-weight:700}.success{background:#dcfce7}.error{background:#fee2e2}.item{display:none;margin-top:14px;padding:14px;background:#f9fafb;border-radius:10px}.name{font-size:21px;font-weight:700}label{display:block;margin-top:14px;font-weight:700}select,input{width:100%;box-sizing:border-box;margin-top:6px;padding:14px;font-size:18px;border:1px solid #d1d5db;border-radius:9px}button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:10px;font-size:18px;font-weight:700}#startBtn{background:#111827;color:#fff}#submitBtn{display:none;background:#c2410c;color:#fff}.small{font-size:13px;color:#6b7280;text-align:center;margin-top:8px}</style></head>
<body><div class="wrap"><div class="card"><h1>Inventory Scanner</h1><button id="startBtn" onclick="startScanner()">Start Scanner</button><div id="reader"></div><div id="status" class="status">Tap Start Scanner</div><div id="itemBox" class="item"><div id="itemName" class="name"></div><div>Barcode: <strong id="itemId"></strong></div><div>Current Qty: <strong id="currentQty"></strong></div><label>Action</label><select id="action"><option value="">Choose action...</option><option value="Add">Add Inventory</option><option value="Remove">Remove Inventory</option><option value="Count">Count Inventory</option></select><label>Quantity</label><input id="qty" type="number" min="0" step="1" inputmode="numeric" placeholder="Enter quantity"></div><button id="submitBtn" onclick="submitTransaction()">Submit Transaction</button><label>Manual barcode entry</label><input id="manualBarcode" type="text" inputmode="numeric" placeholder="Type barcode if needed"><button onclick="lookupManual()">Load Item</button><div class="small">Camera stays open so you can scan the next item immediately.</div></div></div><iframe name="saveFrame" style="display:none"></iframe>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzqxTts9uWW0FG_HpPfBIB-4kytuAmASXkoHsvLYEiwEMcnnRXn7U-pyPP2PJJ8YOOXXw/exec";
let scanner=null,scanLocked=false,currentBarcode="",currentBeforeQty=null,pendingExpectedQty=null;
function setStatus(m,t=""){const b=document.getElementById("status");b.className="status"+(t?" "+t:"");b.textContent=m}
function startScanner(){if(!API_URL.startsWith("https://script.google.com/")){setStatus("Add your Apps Script /exec URL to index.html first.","error");return}document.getElementById("startBtn").style.display="none";setStatus("Requesting camera permission...");scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:12,qrbox:(w,h)=>({width:Math.floor(w*.9),height:Math.min(180,Math.floor(h*.35))}),aspectRatio:1.777778,formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8]},txt=>{if(scanLocked)return;scanLocked=true;lookupItem(String(txt).trim())},()=>{}).then(()=>setStatus("Point camera at an item barcode")).catch(err=>{document.getElementById("startBtn").style.display="block";setStatus("Camera error: "+err,"error")})}
function lookupManual(){const v=document.getElementById("manualBarcode").value.trim();if(!v)return;scanLocked=true;lookupItem(v)}
function lookupItem(barcode){currentBarcode=barcode;setStatus("Looking up item...");jsonp({mode:"lookup",item:barcode},data=>{if(!data||!data.success){setStatus((data&&data.message)||"Item not found.","error");clearItem();setTimeout(()=>{scanLocked=false;setStatus("Scan another barcode")},1200);return}currentBeforeQty=Number(data.currentQty);document.getElementById("itemName").textContent=data.name;document.getElementById("itemId").textContent=barcode;document.getElementById("currentQty").textContent=data.currentQty;document.getElementById("itemBox").style.display="block";document.getElementById("submitBtn").style.display="block";document.getElementById("manualBarcode").value="";setStatus("Item loaded","success")})}
function submitTransaction(){const action=document.getElementById("action").value,qt=document.getElementById("qty").value;if(!action){setStatus("Choose Add, Remove, or Count.","error");return}if(qt===""||Number(qt)<0){setStatus("Enter a valid quantity.","error");return}const qty=Number(qt);if(action==="Add")pendingExpectedQty=currentBeforeQty+qty;if(action==="Remove")pendingExpectedQty=currentBeforeQty-qty;if(action==="Count")pendingExpectedQty=qty;document.getElementById("submitBtn").disabled=true;setStatus("Saving transaction...");const f=document.createElement("form");f.method="POST";f.action=API_URL;f.target="saveFrame";f.style.display="none";({mode:"save",item:currentBarcode,action:action,qty:String(qty)});for(const [k,v] of Object.entries({mode:"save",item:currentBarcode,action:action,qty:String(qty)})){const i=document.createElement("input");i.type="hidden";i.name=k;i.value=v;f.appendChild(i)}document.body.appendChild(f);f.submit();f.remove();setTimeout(verifySave,1400)}
function verifySave(){jsonp({mode:"lookup",item:currentBarcode,t:Date.now()},data=>{document.getElementById("submitBtn").disabled=false;if(!data||!data.success){setStatus("Sent, but verification failed. Check the sheet before retrying.","error");return}const actual=Number(data.currentQty);if(actual!==Number(pendingExpectedQty)){setStatus("Could not verify expected quantity. Sheet shows "+actual+". Check Transaction Log before retrying.","error");document.getElementById("currentQty").textContent=actual;currentBeforeQty=actual;return}setStatus("✓ SAVED — New Qty: "+actual,"success");setTimeout(resetForNextScan,900)})}
function resetForNextScan(){clearItem();scanLocked=false;setStatus("SCAN NEXT ITEM")}
function clearItem(){currentBarcode="";currentBeforeQty=null;pendingExpectedQty=null;document.getElementById("itemName").textContent="";document.getElementById("itemId").textContent="";document.getElementById("currentQty").textContent="";document.getElementById("action").value="";document.getElementById("qty").value="";document.getElementById("itemBox").style.display="none";document.getElementById("submitBtn").style.display="none"}
function jsonp(params,cb){const name="__inv"+Date.now()+Math.floor(Math.random()*99999),s=document.createElement("script");window[name]=d=>{try{cb(d)}finally{delete window[name];s.remove()}};const q=new URLSearchParams(params);q.set("prefix",name);s.src=API_URL+"?"+q.toString();s.onerror=()=>{delete window[name];s.remove();setStatus("Unable to reach inventory service.","error")};document.body.appendChild(s)}
</script></body></html>
