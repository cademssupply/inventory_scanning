<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Cameron EMS Inventory Count</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

:root{
  --bg:#1f2328;
  --panel:#2b3036;
  --panel2:#343a40;
  --border:#4b535c;
  --text:#f3f4f6;
  --muted:#b7bdc5;
  --orange:#f97316;
  --orange-light:#fb923c;
  --orange-dark:#c2410c;
  --success:#14532d;
  --danger:#7f1d1d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#171a1e 0%,var(--bg) 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:27px;
}

.accent{color:var(--orange-light)}

.sub{
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}

.status{
  margin-top:14px;
  padding:14px;
  border-radius:10px;
  background:#20252a;
  border:1px solid var(--border);
  text-align:center;
  font-weight:700;
}

.status.success{
  background:var(--success);
  border-color:#166534;
}

.status.error{
  background:var(--danger);
  border-color:#991b1b;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:700;
}

input{
  width:100%;
  padding:16px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#171a1e;
  color:white;
  font-size:20px;
  outline:none;
}

input:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(249,115,22,.20);
}

.item{
  display:none;
  margin-top:18px;
  padding:18px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-left:5px solid var(--orange);
  border-radius:12px;
}

.item-name{
  font-size:25px;
  font-weight:800;
  margin-bottom:7px;
}

.barcode-display{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

.qty-label{
  color:var(--orange-light);
  font-size:15px;
  text-transform:uppercase;
}

button,.home-button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  text-align:center;
}

.save-btn{
  margin-top:15px;
  background:linear-gradient(180deg,var(--orange-light),var(--orange-dark));
  color:white;
  font-size:20px;
}

.camera-btn{
  margin-top:20px;
  background:var(--panel2);
  color:white;
  border:1px solid var(--border);
}

.wrong-btn{
  margin-top:10px;
  background:transparent;
  color:#ffd7c2;
  border:1px solid var(--orange-dark);
}

.home-button{
  display:block;
  margin-top:15px;
  background:#171a1e;
  color:#d1d5db;
  border:1px solid var(--border);
  text-decoration:none;
}

#reader{
  width:100%;
  margin-top:12px;
}

.workflow{
  margin-top:16px;
  padding:12px;
  background:#20252a;
  border-radius:10px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="header">

<h1>
Cameron EMS
<span class="accent">
Inventory Count
</span>
</h1>

<div class="sub">
Scan barcode • Enter actual quantity • Press Enter
</div>

</div>

<div id="status" class="status">
READY TO SCAN
</div>

<br>

<label for="barcodeInput">
Barcode Scanner / Entry
</label>

<input
id="barcodeInput"
type="text"
autocomplete="off"
spellcheck="false"
placeholder="Scan barcode"
onkeydown="barcodeKey(event)"
>

<div id="itemBox" class="item">

<div id="itemName" class="item-name"></div>

<div class="barcode-display">
Barcode:
<strong id="itemId"></strong>
</div>

<label class="qty-label" for="qty">
Physical Quantity Counted
</label>

<input
id="qty"
type="number"
min="0"
step="1"
inputmode="numeric"
placeholder="Enter actual quantity"
onkeydown="qtyKey(event)"
>

<button
id="saveBtn"
class="save-btn"
onclick="saveCount()"
>
SAVE COUNT
</button>

<button
class="wrong-btn"
onclick="resetForNextItem()"
>
← Wrong Item — Scan Again
</button>

</div>

<div class="workflow">
Scan → Enter Count → Enter → Scan Next Item
</div>

<button
id="cameraBtn"
class="camera-btn"
onclick="startCamera()"
>
Use Camera Scanner
</button>

<div id="reader"></div>

<a
href="index.html"
class="home-button"
>
← Return to Employee Dashboard
</a>

</div>
</div>

<iframe
name="saveFrame"
style="display:none"
></iframe>

<script>

const API_URL=
"https://script.google.com/macros/s/AKfycbyGwziqfDHZpnLlTVnCHxtXAZYn0FZHeOqfdoWl-wJ0MmIOKFWXD7qWS5m0GpGBdbH8tg/exec";

let currentBarcode="";
let scanLocked=false;
let scanner=null;

function barcodeBox(){
return document.getElementById("barcodeInput");
}

function quantityBox(){
return document.getElementById("qty");
}

function setStatus(message,type=""){

const box=
document.getElementById("status");

box.className=
"status"+
(type?" "+type:"");

box.textContent=
message;

}

function barcodeKey(event){

if(event.key!=="Enter") return;

event.preventDefault();

const barcode=
barcodeBox().value.trim();

if(!barcode) return;

if(scanLocked) return;

scanLocked=true;

lookupItem(barcode);

}

function lookupItem(barcode){

currentBarcode=barcode;

setStatus(
"Looking up item..."
);

lookupWithRetry(
barcode,
1
);

}

function lookupWithRetry(
barcode,
attempt
){

jsonpRequest(

{
mode:"item",
item:barcode,
t:Date.now()
},

data=>{

if(
!data ||
!data.success
){

scanLocked=false;
currentBarcode="";

setStatus(
(data&&data.message)||
"Item not found.",
"error"
);

barcodeBox().value="";
barcodeBox().focus();

return;

}

document.getElementById(
"itemName"
).textContent=
data.name;

document.getElementById(
"itemId"
).textContent=
barcode;

document.getElementById(
"itemBox"
).style.display=
"block";

barcodeBox().value="";

setStatus(
"ITEM LOADED — ENTER COUNT",
"success"
);

setTimeout(
()=>{

quantityBox().focus();
quantityBox().select();

},
75
);

},

()=>{

if(attempt<3){

const delay=
attempt===1
?300
:800;

setStatus(
"Connection delayed — retrying..."
);

setTimeout(
()=>{

lookupWithRetry(
barcode,
attempt+1
);

},
delay
);

return;

}

scanLocked=false;
currentBarcode="";

setStatus(
"Unable to reach inventory service. Scan again.",
"error"
);

barcodeBox().value="";
barcodeBox().focus();

}

);

}

function qtyKey(event){

if(event.key!=="Enter") return;

event.preventDefault();

if(
!document.getElementById(
"saveBtn"
).disabled
){

saveCount();

}

}

function saveCount(){

const qtyText=
quantityBox().value;

if(
qtyText==="" ||
Number(qtyText)<0 ||
!Number.isFinite(
Number(qtyText)
)
){

setStatus(
"Enter a valid count.",
"error"
);

quantityBox().focus();

return;

}

const button=
document.getElementById(
"saveBtn"
);

button.disabled=true;

setStatus(
"Saving count..."
);

postTransaction(
currentBarcode,
"Count",
Number(qtyText)
);

setTimeout(
()=>{

button.disabled=false;

setStatus(
"✓ COUNT SAVED — SCAN NEXT ITEM",
"success"
);

resetForNextItem(false);

},
700
);

}

function postTransaction(
barcode,
action,
qty
){

const form=
document.createElement("form");

form.method="POST";
form.action=API_URL;
form.target="saveFrame";
form.style.display="none";

const fields={
mode:"save",
item:barcode,
action:action,
qty:String(qty)
};

Object.entries(fields)
.forEach(
([key,value])=>{

const input=
document.createElement("input");

input.type="hidden";
input.name=key;
input.value=value;

form.appendChild(input);

}
);

document.body.appendChild(form);

form.submit();

setTimeout(
()=>{
form.remove();
},
1500
);

}

function resetForNextItem(
changeStatus=true
){

currentBarcode="";
scanLocked=false;

document.getElementById(
"itemBox"
).style.display=
"none";

document.getElementById(
"itemName"
).textContent="";

document.getElementById(
"itemId"
).textContent="";

quantityBox().value="";
barcodeBox().value="";

if(changeStatus){

setStatus(
"READY TO SCAN"
);

}

setTimeout(
()=>{
barcodeBox().focus();
},
75
);

}

function startCamera(){

const button=
document.getElementById(
"cameraBtn"
);

button.disabled=true;

scanner=
new Html5Qrcode(
"reader"
);

scanner.start(

{facingMode:"environment"},

{fps:12},

decodedText=>{

if(scanLocked) return;

scanLocked=true;

lookupItem(
String(decodedText).trim()
);

},

()=>{}

)

.then(
()=>{
setStatus(
"Point camera at item barcode"
);
}
)

.catch(
error=>{

button.disabled=false;

setStatus(
"Camera error: "+error,
"error"
);

}
);

}

function jsonpRequest(
params,
success,
failure
){

const callbackName=
"__count_"+
Date.now()+
"_"+
Math.floor(
Math.random()*100000
);

const script=
document.createElement("script");

let finished=false;

let timeout;

function cleanup(){

if(finished) return;

finished=true;

clearTimeout(timeout);

try{
delete window[
callbackName
];
}catch(e){}

script.remove();

}

window[
callbackName
]=data=>{

cleanup();

success(data);

};

const query=
new URLSearchParams(
params
);

query.set(
"prefix",
callbackName
);

script.src=
API_URL+
"?"+
query.toString();

script.onerror=
()=>{

cleanup();

failure();

};

timeout=
setTimeout(
()=>{

cleanup();

failure();

},
5000
);

document.body.appendChild(
script
);

}

window.addEventListener(
"load",
()=>{
barcodeBox().focus();
}
);

</script>

</body>
</html>
