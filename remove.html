<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
  Cameron EMS Supply Removal
</title>


<style>

:root {

  --background:#171a1d;
  --card:#272b30;
  --card2:#30353b;

  --border:#4a5057;

  --text:#f5f5f5;
  --muted:#aeb4bb;

  --orange:#f97316;
  --orange2:#ea580c;

  --green:#166534;
  --green-border:#22c55e;

  --red:#7f1d1d;
  --red-border:#ef4444;

}


* {
  box-sizing:border-box;
}


body {

  margin:0;

  background:
    linear-gradient(
      180deg,
      #111315,
      var(--background)
    );

  color:var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height:100vh;

}


.container {

  width:min(
    620px,
    calc(100% - 24px)
  );

  margin:0 auto;

  padding:
    24px 0 40px;

}


.card {

  background:var(--card);

  border:
    1px solid
    var(--border);

  border-radius:20px;

  padding:24px;

}


/* =====================================
   HEADER
===================================== */

.header {

  text-align:center;

  margin-bottom:22px;

}


.header h1 {

  margin:0;

  font-size:30px;

  line-height:1.1;

}


.header h1 span {

  color:var(--orange);

}


.header p {

  margin:
    9px 0 0;

  color:var(--muted);

  font-size:15px;

}


/* =====================================
   START BUTTON
===================================== */

.start-button {

  width:100%;

  min-height:92px;

  border:0;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      var(--orange),
      var(--orange2)
    );

  color:white;

  font-size:28px;

  font-weight:900;

  cursor:pointer;

}


.start-button.active {

  background:#202428;

  border:
    2px solid
    var(--orange);

  color:var(--orange);

}


.start-button:active {

  transform:
    scale(.985);

}


/* =====================================
   STATUS
===================================== */

.status {

  margin-top:18px;

  padding:18px;

  border-radius:12px;

  text-align:center;

  font-size:20px;

  font-weight:900;

  background:#1c2024;

  border:
    1px solid
    var(--border);

}


.status.ready {

  border-color:
    var(--orange);

}


.status.working {

  border-color:
    #fbbf24;

}


.status.success {

  background:
    var(--green);

  border:
    2px solid
    var(--green-border);

}


.status.error {

  background:
    var(--red);

  border:
    2px solid
    var(--red-border);

}


/* =====================================
   BARCODE INPUT
===================================== */

.scan-area {

  margin-top:20px;

}


.scan-area label {

  display:block;

  margin-bottom:7px;

  font-size:14px;

  font-weight:700;

  color:var(--muted);

}


#barcode {

  width:100%;

  height:60px;

  padding:
    0 15px;

  background:#111315;

  border:
    2px solid
    var(--border);

  border-radius:11px;

  color:white;

  font-size:21px;

  outline:none;

}


#barcode:focus {

  border-color:
    var(--orange);

}


/* =====================================
   RESULT
===================================== */

.result {

  display:none;

  margin-top:18px;

  padding:20px;

  background:var(--card2);

  border-radius:13px;

  text-align:center;

}


.result.show {

  display:block;

}


.item-name {

  font-size:27px;

  font-weight:900;

}


.barcode-text {

  margin-top:6px;

  color:var(--muted);

  font-size:13px;

}


.quantity-change {

  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  gap:12px;

  margin-top:18px;

}


.qty {

  padding:13px 8px;

  background:
    rgba(
      0,
      0,
      0,
      .22
    );

  border-radius:10px;

}


.qty-label {

  display:block;

  margin-bottom:5px;

  color:var(--muted);

  font-size:11px;

  text-transform:uppercase;

}


.qty-value {

  font-size:28px;

  font-weight:900;

}


.arrow {

  color:var(--orange);

  font-size:27px;

  font-weight:900;

}


/* =====================================
   INSTRUCTIONS
===================================== */

.instructions {

  margin-top:20px;

  padding:15px;

  background:#1c2024;

  border-radius:11px;

  color:var(--muted);

  text-align:center;

  line-height:1.55;

  font-size:14px;

}


.instructions strong {

  color:var(--orange);

}


/* =====================================
   HOME
===================================== */

.home {

  display:block;

  margin-top:16px;

  padding:16px;

  background:#15181b;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  color:#ddd;

  text-align:center;

  text-decoration:none;

  font-weight:700;

}


/* =====================================
   MOBILE
===================================== */

@media (
  max-width:480px
) {

  .card {

    padding:17px;

  }


  .header h1 {

    font-size:25px;

  }


  .quantity-change {

    grid-template-columns:
      1fr auto 1fr;

    gap:7px;

  }


  .qty-value {

    font-size:23px;

  }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


  <!-- HEADER -->

  <div class="header">

    <h1>
      Cameron EMS
      <span>
        Supply Removal
      </span>
    </h1>

    <p>
      Rapid one-item barcode removal
    </p>

  </div>


  <!-- START -->

  <button
    id="startButton"
    class="start-button"
    type="button"
  >
    START SCANNING
  </button>


  <!-- STATUS -->

  <div
    id="status"
    class="status ready"
  >
    CLICK START SCANNING
  </div>


  <!-- BARCODE -->

  <div class="scan-area">

    <label for="barcode">
      Barcode
    </label>

    <input
      id="barcode"
      type="text"
      inputmode="none"
      autocomplete="off"
      spellcheck="false"
      placeholder="Scan item barcode"
      disabled
    >

  </div>


  <!-- RESULT -->

  <div
    id="result"
    class="result"
  >

    <div
      id="itemName"
      class="item-name"
    >
    </div>


    <div
      id="barcodeText"
      class="barcode-text"
    >
    </div>


    <div class="quantity-change">

      <div class="qty">

        <span class="qty-label">
          Previous
        </span>

        <span
          id="previousQty"
          class="qty-value"
        >
          -
        </span>

      </div>


      <div class="arrow">
        →
      </div>


      <div class="qty">

        <span class="qty-label">
          New QOH
        </span>

        <span
          id="newQty"
          class="qty-value"
        >
          -
        </span>

      </div>

    </div>

  </div>


  <!-- INSTRUCTIONS -->

  <div class="instructions">

    <strong>
      EACH SCAN REMOVES 1
    </strong>

    <br>

    Double ding =
    removal verified.

    <br>

    Honk =
    removal failed.

    <br><br>

    Negative inventory is allowed
    when the physical count is different
    from the spreadsheet.

  </div>


  <a
    href="index.html"
    class="home"
  >
    ← Return to Employee Dashboard
  </a>


</div>

</div>


<!-- POST TARGET -->

<iframe
  id="postFrame"
  name="postFrame"
  style="display:none"
></iframe>


<script>

// ======================================================
// CONFIGURATION
// ======================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxOSkgybcG2mTC-0m26GXX1M6ZQgnjq2V7lqQ4R9Y8aJE-stqALUkVmZL6cZR8pRvLv5w/exec";


const VERIFY_DELAY =
  700;


const SUCCESS_DISPLAY_TIME =
  900;


const FAILURE_DISPLAY_TIME =
  1800;


// ======================================================
// STATE
// ======================================================

let scanningActive =
  false;


let busy =
  false;


let audioContext =
  null;


let transaction = {

  barcode:"",

  itemName:"",

  previousQty:0,

  expectedQty:0

};


// ======================================================
// ELEMENTS
// ======================================================

const startButton =
  document.getElementById(
    "startButton"
  );


const barcodeInput =
  document.getElementById(
    "barcode"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const resultBox =
  document.getElementById(
    "result"
  );


// ======================================================
// START SCANNING
// ======================================================

startButton.addEventListener(
  "click",
  function() {

    initializeAudio();


    scanningActive =
      true;


    busy =
      false;


    barcodeInput.disabled =
      false;


    startButton.textContent =
      "SCANNER ACTIVE";


    startButton.classList.add(
      "active"
    );


    setStatus(
      "READY — SCAN ITEM",
      "ready"
    );


    barcodeInput.value =
      "";


    barcodeInput.focus();

  }
);


// ======================================================
// SCANNER ENTER
// ======================================================

barcodeInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key !== "Enter"
    ) {

      return;

    }


    event.preventDefault();


    if (
      !scanningActive ||
      busy
    ) {

      return;

    }


    const barcode =
      barcodeInput
        .value
        .trim();


    barcodeInput.value =
      "";


    if (!barcode) {

      barcodeInput.focus();

      return;

    }


    beginRemoval(
      barcode
    );

  }
);


// ======================================================
// BEGIN REMOVAL
// ======================================================

function beginRemoval(
  barcode
) {

  busy =
    true;


  hideResult();


  transaction = {

    barcode:
      barcode,

    itemName:
      "",

    previousQty:
      0,

    expectedQty:
      0

  };


  setStatus(
    "CHECKING ITEM...",
    "working"
  );


  lookupStartingQuantity(
    barcode
  );

}


// ======================================================
// GET STARTING QUANTITY
// ======================================================

function lookupStartingQuantity(
  barcode
) {

  jsonpRequest(

    {
      mode:"qty",
      item:barcode,
      t:Date.now()
    },


    function(data) {

      if (
        !data ||
        data.success !== true
      ) {

        failTransaction(
          data &&
          data.message
            ? data.message
            : "ITEM NOT FOUND"
        );

        return;

      }


      const currentQty =
        Number(
          data.currentQty
        );


      if (
        !Number.isFinite(
          currentQty
        )
      ) {

        failTransaction(
          "INVALID INVENTORY QUANTITY"
        );

        return;

      }


      transaction.itemName =
        data.name ||
        "Inventory Item";


      transaction.previousQty =
        currentQty;


      /*
        Negative quantities are intentionally
        allowed.

        1 -> 0
        0 -> -1
       -1 -> -2
      */

      transaction.expectedQty =
        currentQty - 1;


      showItem();


      setStatus(
        "REMOVING 1...",
        "working"
      );


      submitRemoval();


      setTimeout(
        function() {

          verifyRemoval(
            1
          );

        },
        VERIFY_DELAY
      );

    },


    function() {

      failTransaction(
        "INVENTORY SERVICE NOT AVAILABLE"
      );

    }

  );

}


// ======================================================
// POST REMOVE
// ======================================================

function submitRemoval() {

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    API_URL;


  form.target =
    "postFrame";


  form.style.display =
    "none";


  const fields = {

    mode:"save",

    item:
      transaction.barcode,

    action:
      "Remove",

    qty:
      "1"

  };


  Object.keys(
    fields
  ).forEach(
    function(key) {

      const input =
        document.createElement(
          "input"
        );


      input.type =
        "hidden";


      input.name =
        key;


      input.value =
        fields[key];


      form.appendChild(
        input
      );

    }
  );


  document.body.appendChild(
    form
  );


  form.submit();


  setTimeout(
    function() {

      form.remove();

    },
    2500
  );

}


// ======================================================
// VERIFY
// ======================================================

function verifyRemoval(
  attempt
) {

  setStatus(
    "VERIFYING REMOVAL...",
    "working"
  );


  jsonpRequest(

    {
      mode:"qty",
      item:
        transaction.barcode,

      t:Date.now()
    },


    function(data) {

      if (
        !data ||
        data.success !== true
      ) {

        retryVerification(
          attempt
        );

        return;

      }


      const actualQty =
        Number(
          data.currentQty
        );


      if (
        !Number.isFinite(
          actualQty
        )
      ) {

        retryVerification(
          attempt
        );

        return;

      }


      // ----------------------------------------------
      // VERIFIED SUCCESS
      // ----------------------------------------------

      if (
        actualQty ===
        transaction.expectedQty
      ) {

        successfulTransaction(
          actualQty
        );

        return;

      }


      // ----------------------------------------------
      // SPREADSHEET HAS NOT CHANGED YET
      // ----------------------------------------------

      if (
        actualQty ===
        transaction.previousQty
      ) {

        retryVerification(
          attempt
        );

        return;

      }


      // ----------------------------------------------
      // QUANTITY CHANGED TO SOMETHING UNEXPECTED
      // ----------------------------------------------

      failTransaction(
        "UNEXPECTED INVENTORY COUNT",
        actualQty
      );

    },


    function() {

      retryVerification(
        attempt
      );

    }

  );

}


// ======================================================
// RETRY VERIFICATION
// ======================================================

function retryVerification(
  attempt
) {

  if (
    attempt < 5
  ) {

    setTimeout(
      function() {

        verifyRemoval(
          attempt + 1
        );

      },
      500
    );


    return;

  }


  failTransaction(
    "REMOVAL NOT VERIFIED"
  );

}


// ======================================================
// SUCCESS
// ======================================================

function successfulTransaction(
  actualQty
) {

  showResult(
    transaction.previousQty,
    actualQty
  );


  setStatus(
    "✓ REMOVED 1 — VERIFIED",
    "success"
  );


  playDoubleDing();


  setTimeout(
    function() {

      resetForNextScan();

    },
    SUCCESS_DISPLAY_TIME
  );

}


// ======================================================
// FAILURE
// ======================================================

function failTransaction(
  message,
  actualQty
) {

  setStatus(
    "✕ " + message,
    "error"
  );


  if (
    typeof actualQty !==
    "undefined"
  ) {

    showResult(
      transaction.previousQty,
      actualQty
    );

  }


  playHonk();


  setTimeout(
    function() {

      resetForNextScan();

    },
    FAILURE_DISPLAY_TIME
  );

}


// ======================================================
// RESET FOR NEXT SCAN
// ======================================================

function resetForNextScan() {

  busy =
    false;


  transaction = {

    barcode:"",

    itemName:"",

    previousQty:0,

    expectedQty:0

  };


  barcodeInput.value =
    "";


  hideResult();


  setStatus(
    "READY — SCAN NEXT ITEM",
    "ready"
  );


  setTimeout(
    function() {

      barcodeInput.focus();

    },
    50
  );

}


// ======================================================
// ITEM DISPLAY
// ======================================================

function showItem() {

  document.getElementById(
    "itemName"
  ).textContent =
    transaction.itemName;


  document.getElementById(
    "barcodeText"
  ).textContent =
    "Barcode: " +
    transaction.barcode;


  document.getElementById(
    "previousQty"
  ).textContent =
    transaction.previousQty;


  document.getElementById(
    "newQty"
  ).textContent =
    transaction.expectedQty;


  resultBox.classList.add(
    "show"
  );

}


// ======================================================
// RESULT DISPLAY
// ======================================================

function showResult(
  previousQty,
  newQty
) {

  document.getElementById(
    "itemName"
  ).textContent =
    transaction.itemName;


  document.getElementById(
    "barcodeText"
  ).textContent =
    "Barcode: " +
    transaction.barcode;


  document.getElementById(
    "previousQty"
  ).textContent =
    previousQty;


  document.getElementById(
    "newQty"
  ).textContent =
    newQty;


  resultBox.classList.add(
    "show"
  );

}


function hideResult() {

  resultBox.classList.remove(
    "show"
  );

}


// ======================================================
// STATUS
// ======================================================

function setStatus(
  message,
  type
) {

  statusBox.className =
    "status " +
    type;


  statusBox.textContent =
    message;

}


// ======================================================
// AUDIO
// ======================================================

function initializeAudio() {

  if (
    audioContext
  ) {

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

    return;

  }


  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioContextClass
  ) {

    return;

  }


  audioContext =
    new AudioContextClass();


  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();

  }

}


// ======================================================
// TONE
// ======================================================

function tone(
  frequency,
  delay,
  duration,
  volume,
  type
) {

  if (
    !audioContext
  ) {

    return;

  }


  const oscillator =
    audioContext
      .createOscillator();


  const gain =
    audioContext
      .createGain();


  const startTime =
    audioContext.currentTime +
    delay;


  oscillator.type =
    type || "sine";


  oscillator.frequency
    .setValueAtTime(
      frequency,
      startTime
    );


  gain.gain
    .setValueAtTime(
      0.0001,
      startTime
    );


  gain.gain
    .exponentialRampToValueAtTime(
      volume,
      startTime + 0.015
    );


  gain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      startTime + duration
    );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start(
    startTime
  );


  oscillator.stop(
    startTime +
    duration +
    0.05
  );

}


// ======================================================
// DOUBLE DING
// ======================================================

function playDoubleDing() {

  initializeAudio();


  tone(
    880,
    0,
    0.16,
    0.25,
    "sine"
  );


  tone(
    1175,
    0.20,
    0.20,
    0.25,
    "sine"
  );

}


// ======================================================
// HONK
// ======================================================

function playHonk() {

  initializeAudio();


  tone(
    210,
    0,
    0.55,
    0.28,
    "sawtooth"
  );


  tone(
    175,
    0.03,
    0.55,
    0.16,
    "square"
  );

}


// ======================================================
// JSONP REQUEST
// ======================================================

function jsonpRequest(
  parameters,
  onSuccess,
  onFailure
) {

  const callbackName =

    "__cameronEMS_" +

    Date.now() +

    "_" +

    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;


  let timeout;


  function cleanup() {

    if (
      completed
    ) {

      return;

    }


    completed =
      true;


    clearTimeout(
      timeout
    );


    try {

      delete window[
        callbackName
      ];

    }

    catch (error) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  window[
    callbackName
  ] =
    function(data) {

      cleanup();


      onSuccess(
        data
      );

    };


  const query =
    new URLSearchParams(
      parameters
    );


  query.set(
    "prefix",
    callbackName
  );


  script.src =
    API_URL +
    "?" +
    query.toString();


  script.onerror =
    function() {

      cleanup();

      onFailure();

    };


  timeout =
    setTimeout(
      function() {

        cleanup();

        onFailure();

      },
      6000
    );


  document.body.appendChild(
    script
  );

}

</script>


</body>

</html>
