<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Cameron EMS Supply Usage</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --bg:#1f2328;
      --panel:#2b3036;
      --panel-2:#343a40;
      --border:#4b535c;
      --text:#f3f4f6;
      --muted:#b7bdc5;
      --orange:#f97316;
      --orange-dark:#c2410c;
      --orange-light:#fb923c;
      --danger:#7f1d1d;
      --success:#14532d;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:linear-gradient(180deg,#171a1e 0%,var(--bg) 100%);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
    }

    .wrap{
      max-width:640px;
      margin:0 auto;
      padding:18px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
      box-shadow:0 8px 28px rgba(0,0,0,.28);
    }

    .header{
      text-align:center;
      margin-bottom:16px;
    }

    .header h1{
      margin:0;
      font-size:26px;
      letter-spacing:.3px;
    }

    .header .accent{
      color:var(--orange-light);
    }

    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
    }

    .mode-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:12px;
    }

    button{
      width:100%;
      padding:15px;
      border:0;
      border-radius:11px;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
    }

    .camera-btn{
      background:var(--orange);
      color:#fff;
    }

    .hardware-btn{
      background:var(--panel-2);
      color:var(--text);
      border:1px solid var(--border);
    }

    .remove-btn{
      background:linear-gradient(180deg,var(--orange-light),var(--orange-dark));
      color:#fff;
      font-size:19px;
      margin-top:16px;
    }

    .wrong-btn{
      background:transparent;
      color:#ffd7c2;
      border:1px solid var(--orange-dark);
      margin-top:10px;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:12px;
      background:#111;
      margin-top:10px;
    }

    .status{
      margin-top:12px;
      padding:13px;
      border-radius:10px;
      background:#20252a;
      border:1px solid var(--border);
      text-align:center;
      font-weight:700;
      color:var(--text);
    }

    .status.success{
      background:var(--success);
      border-color:#166534;
    }

    .status.error{
      background:var(--danger);
      border-color:#991b1b;
    }

    .scanner-section{
      margin-top:14px;
      padding-top:14px;
      border-top:1px solid var(--border);
    }

    label{
      display:block;
      font-weight:700;
      margin-bottom:7px;
      color:#fff;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#171a1e;
      color:#fff;
      font-size:18px;
      outline:none;
    }

    input:focus{
      border-color:var(--orange);
      box-shadow:0 0 0 3px rgba(249,115,22,.18);
    }

    input::placeholder{
      color:#7f8790;
    }

    .item{
      display:none;
      margin-top:16px;
      padding:16px;
      background:var(--panel-2);
      border:1px solid var(--border);
      border-left:5px solid var(--orange);
      border-radius:12px;
    }

    .item-name{
      font-size:22px;
      font-weight:800;
      margin-bottom:6px;
    }

    .barcode{
      color:var(--muted);
      font-size:14px;
      margin-bottom:16px;
    }

    .qty-label{
      color:var(--orange-light);
      font-size:15px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .tip{
      margin-top:12px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }

    @media(max-width:520px){
      .mode-grid{grid-template-columns:1fr}
      .wrap{padding:12px}
      .card{padding:16px}
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="header">
      <h1>Cameron EMS <span class="accent">Supply Usage</span></h1>
      <div class="sub">Scan item • Enter quantity • Press Enter</div>
    </div>

    <div class="mode-grid">
      <button id="startBtn" class="camera-btn" onclick="startScanner()">
        Start Camera Scanner
      </button>

      <button class="hardware-btn" onclick="focusHardware()">
        Use Barcode Scanner
      </button>
    </div>

    <div id="reader"></div>

    <div id="status" class="status">
      Choose camera or hardware scanner
    </div>

    <div class="scanner-section">
      <label for="hardwareBarcode">Wireless / USB Scanner Input</label>

      <input
        id="hardwareBarcode"
        type="text"
        autocomplete="off"
        placeholder="Scan barcode here"
        onkeydown="hardwareKey(event)"
      >
    </div>

    <div id="itemBox" class="item">

      <div id="itemName" class="item-name"></div>

      <div class="barcode">
        Barcode:
        <strong id="itemId"></strong>
      </div>

      <label class="qty-label" for="qty">
        Quantity Removed
      </label>

      <input
        id="qty"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        placeholder="Enter quantity removed"
        onkeydown="qtyEnter(event)"
      >

      <button
        id="submitBtn"
        class="remove-btn"
        onclick="submitTransaction()"
      >
        Remove Inventory
      </button>

      <button
        class="wrong-btn"
        onclick="resetForNextScan()"
      >
        ← Wrong Item — Scan Again
      </button>

    </div>

    <div class="tip">
      After a successful removal, the page resets automatically and is ready for the next barcode.
    </div>

  </div>
</div>

<iframe
  name="saveFrame"
  id="saveFrame"
  style="display:none">
</iframe>


<script>

// =====================================================
// PASTE YOUR EXISTING APPS SCRIPT /exec URL HERE
// =====================================================

const API_URL = "https://script.google.com/macros/s/AKfycbyGwziqfDHZpnLlTVnCHxtXAZYn0FZHeOqfdoWl-wJ0MmIOKFWXD7qWS5m0GpGBdbH8tg/exec";


// =====================================================
// STATE
// =====================================================

let scanner = null;
let scanLocked = false;
let currentBarcode = "";


// =====================================================
// STATUS
// =====================================================

function setStatus(message, type = "") {

  const box =
    document.getElementById("status");

  box.className =
    "status" +
    (type ? " " + type : "");

  box.textContent =
    message;
}


// =====================================================
// CAMERA SCANNER
// =====================================================

function startScanner() {

  if (
    !API_URL.startsWith(
      "https://script.google.com/"
    )
  ) {

    setStatus(
      "Add your Apps Script /exec URL first.",
      "error"
    );

    return;
  }


  document.getElementById(
    "startBtn"
  ).style.display =
    "none";


  setStatus(
    "Requesting camera permission..."
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps:
        12,

      aspectRatio:
        1.777778,

      qrbox:
        (width, height) => ({

          width:
            Math.floor(
              width * .9
            ),

          height:
            Math.min(
              180,
              Math.floor(
                height * .35
              )
            )

        }),

      formatsToSupport: [

        Html5QrcodeSupportedFormats.QR_CODE,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8

      ]

    },

    decodedText => {

      if (scanLocked) {
        return;
      }

      scanLocked = true;

      lookupItem(
        String(
          decodedText
        ).trim()
      );

    },

    () => {}

  )

  .then(
    () => {

      setStatus(
        "Point camera at an item barcode"
      );

    }
  )

  .catch(
    error => {

      document.getElementById(
        "startBtn"
      ).style.display =
        "block";

      setStatus(
        "Camera error: " +
        error,
        "error"
      );

    }
  );

}


// =====================================================
// HARDWARE SCANNER
// =====================================================

function focusHardware() {

  document.getElementById(
    "hardwareBarcode"
  ).focus();


  setStatus(
    "Ready for wireless / USB barcode scanner"
  );

}


function hardwareKey(event) {

  if (
    event.key !== "Enter"
  ) {
    return;
  }


  event.preventDefault();


  const barcode =
    event.target
      .value
      .trim();


  if (
    !barcode ||
    scanLocked
  ) {
    return;
  }


  scanLocked =
    true;


  lookupItem(
    barcode
  );

}


// =====================================================
// LOOK UP ITEM NAME ONLY
// =====================================================

function lookupItem(
  barcode
) {

  currentBarcode =
    barcode;


  setStatus(
    "Looking up item..."
  );


  jsonp(

    {

      mode:
        "item",

      item:
        barcode

    },

    data => {

      if (
        !data ||
        !data.success
      ) {

        setStatus(
          (
            data &&
            data.message
          ) ||
          "Item not found.",
          "error"
        );


        clearItem();


        setTimeout(
          () => {

            scanLocked =
              false;

            focusHardware();

          },
          800
        );


        return;
      }


      document.getElementById(
        "itemName"
      ).textContent =
        data.name;


      document.getElementById(
        "itemId"
      ).textContent =
        barcode;


      document.getElementById(
        "hardwareBarcode"
      ).value =
        "";


      document.getElementById(
        "itemBox"
      ).style.display =
        "block";


      setStatus(
        "Item loaded",
        "success"
      );


      document.getElementById(
        "qty"
      ).focus();

    }

  );

}


// =====================================================
// ENTER KEY AUTO-SUBMIT
// =====================================================

function qtyEnter(
  event
) {

  if (
    event.key !== "Enter"
  ) {
    return;
  }


  event.preventDefault();


  const submitButton =
    document.getElementById(
      "submitBtn"
    );


  if (
    !submitButton.disabled
  ) {

    submitTransaction();

  }

}


// =====================================================
// REMOVE INVENTORY
// =====================================================

function function submitTransaction() {

  const qtyText = document.getElementById("qty").value;

  if (qtyText === "" || Number(qtyText) <= 0) {
    setStatus("Enter the quantity removed.", "error");
    return;
  }

  if (!currentBarcode) {
    setStatus("No item selected. Scan the item again.", "error");
    return;
  }

  const button = document.getElementById("submitBtn");

  button.disabled = true;
  setStatus("Saving removal...");

  const form = document.createElement("form");

  form.method = "POST";
  form.action = API_URL;
  form.target = "saveFrame";
  form.style.display = "none";

  const fields = {
    mode: "save",
    item: currentBarcode,
    action: "Remove",
    qty: String(Number(qtyText))
  };

  Object.entries(fields).forEach(([key, value]) => {

    const input = document.createElement("input");

    input.type = "hidden";
    input.name = key;
    input.value = value;

    form.appendChild(input);

  });

  document.body.appendChild(form);

  form.submit();

  /*
    IMPORTANT:
    Don't immediately remove the form.
    Give the browser time to actually send the POST.
  */
  setTimeout(() => {
    form.remove();
  }, 2000);

  /*
    Give Google Apps Script more time to process
    before resetting the interface.
  */
  setTimeout(() => {

    button.disabled = false;

    setStatus("✓ REMOVED", "success");

    setTimeout(() => {
      resetForNextScan();
    }, 1000);

  }, 1500);
}{

  const qtyText =
    document.getElementById(
      "qty"
    ).value;


  if (
    qtyText === "" ||
    Number(qtyText) <= 0
  ) {

    setStatus(
      "Enter the quantity removed.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "submitBtn"
    );


  button.disabled =
    true;


  setStatus(
    "Saving..."
  );


  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    API_URL;


  form.target =
    "saveFrame";


  form.style.display =
    "none";


  const fields = {

    mode:
      "save",

    item:
      currentBarcode,

    action:
      "Remove",

    qty:
      String(
        Number(
          qtyText
        )
      )

  };


  Object.entries(
    fields
  ).forEach(
    ([key, value]) => {

      const input =
        document.createElement(
          "input"
        );

      input.type =
        "hidden";

      input.name =
        key;

      input.value =
        value;

      form.appendChild(
        input
      );

    }
  );


  document.body.appendChild(
    form
  );


  form.submit();


  form.remove();


  /*
    This interface intentionally
    does not re-query quantity.
  */

  setTimeout(
    () => {

      button.disabled =
        false;


      setStatus(
        "✓ REMOVED",
        "success"
      );


      setTimeout(
        resetForNextScan,
        500
      );

    },
    550
  );

}


// =====================================================
// RESET
// =====================================================

function resetForNextScan() {

  clearItem();


  scanLocked =
    false;


  setStatus(
    "SCAN NEXT ITEM"
  );


  focusHardware();

}


function clearItem() {

  currentBarcode =
    "";


  document.getElementById(
    "itemName"
  ).textContent =
    "";


  document.getElementById(
    "itemId"
  ).textContent =
    "";


  document.getElementById(
    "qty"
  ).value =
    "";


  document.getElementById(
    "hardwareBarcode"
  ).value =
    "";


  document.getElementById(
    "itemBox"
  ).style.display =
    "none";

}


// =====================================================
// JSONP ITEM LOOKUP
// =====================================================

function jsonp(
  params,
  callback
) {

  const callbackName =
    "__inventory_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  window[
    callbackName
  ] =
    data => {

      try {

        callback(
          data
        );

      } finally {

        delete window[
          callbackName
        ];

        script.remove();

      }

    };


  const query =
    new URLSearchParams(
      params
    );


  query.set(
    "prefix",
    callbackName
  );


  script.src =
    API_URL +
    "?" +
    query.toString();


  script.onerror =
    () => {

      delete window[
        callbackName
      ];


      script.remove();


      setStatus(
        "Unable to reach inventory service.",
        "error"
      );

    };


  document.body.appendChild(
    script
  );

}

</script>

</body>
</html>
